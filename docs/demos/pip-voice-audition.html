<script>
  const list = document.querySelector("#lines");
  const audio = document.querySelector("#recording");
  const status = document.querySelector("#status");
  const stop = document.querySelector("#stop");
  const samples = JSON.parse(document.querySelector("#samples").textContent);
  let active = 0;

  async function play(sample) {
    const token = ++active;
    audio.pause();
    stop.disabled = false;
    status.textContent = "Playing " + sample.label.toLowerCase() + "…";
    audio.src = sample.data;
    audio.onended = () => {
      if (token !== active) return;
      stop.disabled = true;
      status.textContent = "Finished playing " + sample.label.toLowerCase() + ".";
    };
    try {
      await audio.play();
    } catch {
      if (token !== active) return;
      stop.disabled = true;
      status.textContent = "The recording could not play.";
    }
  }

  stop.onclick = () => {
    active++;
    audio.pause();
    stop.disabled = true;
    status.textContent = "Audio stopped.";
  };

  for (const sample of samples) {
    const row = document.createElement("li");
    const copy = document.createElement("div");
    const label = document.createElement("strong");
    const line = document.createElement("p");
    const button = document.createElement("button");
    label.textContent = sample.label;
    line.textContent = sample.text;
    copy.append(label, line);
    button.type = "button";
    button.textContent = "Play";
    button.setAttribute("aria-label", "Play " + sample.label.toLowerCase());
    button.onclick = () => play(sample);
    row.append(copy, button);
    list.append(row);
  }
</script>
