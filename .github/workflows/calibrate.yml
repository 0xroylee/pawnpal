name: Difficulty calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/calibrate/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: difficulty-calibration
          path: tools/calibrate/results/*.md
