name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check:native
      - run: bun run check:licenses
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run playwright install --with-deps chromium
      - run: bun run build
      - run: bun run e2e
      - if: runner.os == 'macOS'
        run: bun run playwright install webkit
      - if: runner.os == 'macOS'
        run: bun run e2e --project=tablet
        env:
          PAWNPAL_E2E_WEBKIT: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ runner.os }}
          path: test-results/
          retention-days: 7
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm run smoke:package
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, browser, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: Check tag version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm run check:pack
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
